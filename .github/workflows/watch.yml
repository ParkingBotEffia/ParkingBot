name: watch-effia-valserhone

# Dispatched every 30 min by an EXTERNAL cron-job.org job (see README "Trigger").
# Each run then checks every 5 min for 28 min and exits, so detection stays at a
# 5-min cadence on ~48 runs/day instead of 288.
#
# There is deliberately NO `schedule:` cron here. It was a second trigger firing
# into the same `concurrency` group as the external dispatcher, and when GitHub
# can't hand out a runner the queued runs fail (15-min timeout) or get evicted —
# which is what produced the 2026-08-06 email flood. cron-job.org is the single
# trigger; if it ever dies, the healthchecks.io dead-man's-switch says so.
on:
  workflow_dispatch:
    inputs:
      test_email:
        description: "Send a plain test email instead of checking availability"
        type: boolean
        default: false
      self_test:
        description: "Run the full alert path on a captured 'available' page and email it"
        type: boolean
        default: false
      health_test:
        description: "Send a test of the 'bot is broken' breakage-alarm email"
        type: boolean
        default: false
      test_sms:
        description: "Send a test SMS via Free Mobile to verify SMS setup"
        type: boolean
        default: false

# Allow the job to push the updated state.json back to the repo.
permissions:
  contents: write

# Never let two runs overlap (a slow run + the next schedule tick).
concurrency:
  group: watch-effia
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    # A run is now long-lived (~29 min). Cap it just above that so a wedged run
    # can't hold the concurrency group for the 6-hour default and block every
    # subsequent dispatch.
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send test email (manual only)
        if: ${{ inputs.test_email }}
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_TO: ${{ secrets.NOTIFY_TO }}
          FREE_SMS_USER: ${{ secrets.FREE_SMS_USER }}
          FREE_SMS_PASS: ${{ secrets.FREE_SMS_PASS }}
          PYTHONPATH: src
        run: python -m parkingbot.main --test-email

      - name: Self-test full alert path (manual only)
        if: ${{ inputs.self_test }}
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_TO: ${{ secrets.NOTIFY_TO }}
          FREE_SMS_USER: ${{ secrets.FREE_SMS_USER }}
          FREE_SMS_PASS: ${{ secrets.FREE_SMS_PASS }}
          PYTHONPATH: src
        run: python -m parkingbot.main --self-test

      - name: Health-alarm test (manual only)
        if: ${{ inputs.health_test }}
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_TO: ${{ secrets.NOTIFY_TO }}
          FREE_SMS_USER: ${{ secrets.FREE_SMS_USER }}
          FREE_SMS_PASS: ${{ secrets.FREE_SMS_PASS }}
          PYTHONPATH: src
        run: python -m parkingbot.main --health-test

      - name: Send test SMS (manual only)
        if: ${{ inputs.test_sms }}
        env:
          FREE_SMS_USER: ${{ secrets.FREE_SMS_USER }}
          FREE_SMS_PASS: ${{ secrets.FREE_SMS_PASS }}
          PYTHONPATH: src
        run: python -m parkingbot.main --test-sms

      - name: Check availability
        if: ${{ !inputs.test_email && !inputs.self_test && !inputs.health_test && !inputs.test_sms }}
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_TO: ${{ secrets.NOTIFY_TO }}
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
          FREE_SMS_USER: ${{ secrets.FREE_SMS_USER }}
          FREE_SMS_PASS: ${{ secrets.FREE_SMS_PASS }}
          PYTHONPATH: src
        run: python -m parkingbot.main --loop --duration 1680

      - name: Persist state + daily heartbeat
        if: ${{ !inputs.test_email && !inputs.self_test && !inputs.health_test && !inputs.test_sms }}
        run: |
          # The heartbeat is today's UTC date, so this is at most one commit a day.
          # It no longer guards against GitHub's 60-day auto-disable (that only hits
          # `schedule:` workflows, and this one is dispatch-only now); it's kept as a
          # cheap daily "the bot was alive" marker in the git history.
          date -u +%Y-%m-%d > heartbeat.txt
          if [[ -n "$(git status --porcelain state.json heartbeat.txt)" ]]; then
            git config user.name "ParkingBotEffia"
            git config user.email "294556926+ParkingBotEffia@users.noreply.github.com"
            git add state.json heartbeat.txt
            git commit -m "Update state / heartbeat [skip ci]"
            git push
          else
            echo "No change; nothing to commit."
          fi
